server:
  port: 8090

spring:
  application:
    name: bank-warning-server
  datasource:
    url: ${BANK_DB_URL:jdbc:postgresql://localhost:5432/bank_risk_db}
    username: ${BANK_DB_USERNAME:postgres}
    password: ${BANK_DB_PASSWORD:123456}
    driver-class-name: org.postgresql.Driver

  # Kafka 4.0 配置
  kafka:
    # Kafka 服务器地址，多个用逗号分隔
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}

    # 生产者配置
    producer:
      # key 用 String 序列化
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # value 用 Json 序列化
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # acks=all 表示需要所有副本都确认才认为发送成功
      acks: all
      # 发送失败重试 10 次
      retries: 10
      properties:
        # 开启幂等生产者，避免网络重试时不产生重复消息
        enable.idempotence: true
        # 最多允许 5 个未确认请求
        max.in.flight.requests.per.connection: 5
        # 发送总超时 2 分钟
        delivery.timeout.ms: 120000
        # 请求超时 30 秒
        request.timeout.ms: 30000

    # 消费者配置
    consumer:
      # 消费者组 ID，同一组内的消费者负载均衡消费
      group-id: ${KAFKA_RESULT_GROUP_ID:bank-warning-result-consumer}
      # key 用 String 反序列化
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # value 用 Json 反序列化
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      # 新消费者从头开始消费
      auto-offset-reset: earliest
      # 关闭自动提交，我们手动确认消费成功
      enable-auto-commit: false
      properties:
        # 只信任自己包下的 JSON 反序列化
        spring.json.trusted.packages: com.yangtze.bankwarning.dto.kafka
        # 只读取已提交的消息
        isolation.level: read_committed

    # 监听器配置
    listener:
      # 手动确认模式
      ack-mode: manual
      # 并发数 2
      concurrency: 2

# 自定义应用配置
app:
  # 保留旧的 HTTP 模型服务配置（用于回退）
  model-service:
    base-url: http://localhost:8088
    default-model-api: /v0/mi/risk-level
    connect-timeout: 5s
    read-timeout: 600s
  # Kafka 相关配置
  kafka:
    # 是否启用 Kafka 模式
    enabled: ${KAFKA_ENABLED:true}
    # 任务 Topic 名称
    task-topic: ${KAFKA_TASK_TOPIC:bank.model.task.v1}
    # 结果 Topic 名称
    result-topic: ${KAFKA_RESULT_TOPIC:bank.model.result.v1}
    # 死信队列 Topic 名称
    result-dlt-topic: ${KAFKA_RESULT_DLT_TOPIC:bank.model.result.dlt.v1}
